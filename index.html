<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Jimmy Pocock</title>
    <meta name="description" content="Developer, Thinker, Conversationalist">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link href='https://fonts.googleapis.com/css?family=Josefin+Sans:400,300,600' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Lato' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="header">
      <h1>
        <span class="letter">j</span>
        <span class="letter">i</span>
        <span class="letter">m</span>
        <span class="letter">m</span>
        <span class="letter">y</span>
        <span class="letter space"></span>
        <span class="letter">p</span>
        <span class="letter">o</span>
        <span class="letter">c</span>
        <span class="letter">o</span>
        <span class="letter">c</span>
        <span class="letter">k</span>
      </h1>
    </div>
    <div id="yield"></div>

    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/zepto/1.1.6/zepto.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/js-signals/1.0.0/js-signals.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/crossroads/0.12.2/crossroads.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/hasher/1.2.0/hasher.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/2.2.1/mustache.min.js"></script>
    <script type="text/javascript" src="js/bundled.js"></script>

    <script>


      var getTemplate = function(slug, data) {
        var fileLocation = 'templates/' + slug + '.mst';
        $.get(fileLocation, function(template) {
          var rendered = Mustache.render(template, data);
          $('#yield').html(rendered);
        });
      };

      var populateThought = function(slug) {
        var rawFile = new XMLHttpRequest();
        var fileLocation = 'thoughts/' + slug + '.txt';
        rawFile.open('GET', fileLocation, false);
        rawFile.onreadystatechange = function () {
          if(rawFile.readyState === 4)
          {
            if(rawFile.status === 200 || rawFile.status === 0)
            {
              var
              allText       = rawFile.responseText,
              textArr       = allText.split(/\n/).filter(function(v){ return v !== ''; }),
              title         = textArr.shift(),
              formattedText = textArr.join('</br></br>');
              getTemplate('thought', { title: title, thought: formattedText });
            }
          }
        };
        rawFile.send(null);
      };

      crossroads.addRoute('/', function() {
        getTemplate('home');
      });

      crossroads.addRoute('/developer', function(slug) {
        getTemplate('developer');
      });

      crossroads.addRoute('/thoughts', function(slug) {
        getTemplate('thoughts');
      });

      crossroads.addRoute('/conversationalist', function(slug) {
        getTemplate('conversationalist');
      });

      crossroads.addRoute('/thoughts/{slug}', function(slug) {
        populateThought(slug);
      });

      // log all routes
      crossroads.routed.add(console.log, console);

      crossroads.bypassed.add(function(request) {
        console.error(request + ' seems to be a dead end...');
      });

      function parseHash(newHash, oldHash){
        // second parameter of crossroads.parse() is the "defaultArguments" and should be an array
        // so we ignore the "oldHash" argument to avoid issues.
        crossroads.parse(newHash);
      }
      hasher.initialized.add(parseHash); //parse initial hash
      hasher.changed.add(parseHash); //parse hash changes

      hasher.init(); //start listening for hash changes

    </script>
  </body>
</html>
